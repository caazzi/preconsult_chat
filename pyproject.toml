[project]
name = "preconsult"
version = "0.1.0"
description = "PreConsult - Privacy-First Medical Intake Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "gunicorn==26.1.0",
    "langchain-google-vertexai==3.2.4",
    "langchain==1.3.16",
    "pydantic==2.13.4",
    "reportlab==5.0.0",
    "uvicorn[standard]==0.52.4",
    "google-cloud-aiplatform==1.165.0",
    "python-dotenv==1.2.3",
    "redis==8.1.0",
    "reflex==0.9.8.post1",
    "sentry-sdk==2.68.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "httpx",
    "ruff",
]
# Browser E2E. Kept separate from `test` so the coverage-gated unit suite stays
# lean and the Playwright specs (which drive a real backend + browser, not the
# Python state machine) don't enter the 80% branch-coverage gate.
e2e = [
    "playwright",
    "pytest-playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as async",
    "e2e: browser end-to-end tests (drive a real backend via Playwright)",
]
# `-m 'not e2e'` keeps browser specs out of the default suite (they need the
# `e2e` extra + Playwright + a booted backend). scripts/run_e2e.sh overrides
# with an explicit `-m e2e`.
addopts = "--strict-markers -m 'not e2e'"
norecursedirs = [
    ".git",
    ".venv",
    ".direnv",
    "node_modules",
    ".web",
    "tests/e2e",
]

[tool.coverage.run]
source = ["src/preconsult", "reflex_app/preconsult"]
# The Reflex page/component tree is generated declaratively and contributes
# little behavioral value per assertion, so omit it from the gate to keep the
# coverage signal pointed at the code that can actually regress behaviour.
omit = ["reflex_app/preconsult/preconsult.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["src/preconsult"]
