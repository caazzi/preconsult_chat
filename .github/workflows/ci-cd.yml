name: PreConsult CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy_profile:
        description: 'Deployment Profile (cost_optimized = 0.5 CPU/1Gi/min-instances=1/concurrency=1/throttling [keeps one warm instance, default], high_performance = 2 CPU/2Gi/min-instances=2/concurrency=40/no-throttle)'
        required: true
        default: 'cost_optimized'
        type: choice
        options:
          - cost_optimized
          - high_performance

env:
  PROJECT_ID: securemed-chat-494521
  REGION: us-central1
  SERVICE_NAME: preconsult
  AR_REPO: securemed-repo
  WIF_PROVIDER: projects/811607528687/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-deploy-sa@securemed-chat-494521.iam.gserviceaccount.com
  DEPLOY_PROFILE: ${{ inputs.deploy_profile || 'cost_optimized' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.11"
        enable-cache: true
        
    # `--locked` (not just a plain sync): CI must install exactly the lockfile
    # that ships in the image, and fail loudly if the lock has gone stale.
    # Without it uv silently re-resolves when the lock is out of date relative to
    # pyproject.toml -- that is how a PR once tested 132 packages, including a
    # newer release than the image would have shipped, and the suite failed on an
    # API the deployed build did not have.
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Run linting
      run: uv run ruff check .

    - name: Verify contract artifacts are current
      run: |
        uv run python scripts/export_contracts.py
        if ! git diff --exit-code -- contracts/; then
          echo "::error::contracts/ is stale. Run scripts/export_contracts.py and commit the result."
          exit 1
        fi

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      working-directory: web
      run: npm ci

    - name: Verify web contract copies are current
      working-directory: web
      run: |
        node scripts/sync-contracts.mjs
        if ! git diff --exit-code -- web/src/contracts/generated/; then
          echo "::error::web/src/contracts/generated is stale. Run 'npm run sync:contracts' in web/ and commit the result."
          exit 1
        fi

    - name: Lint web
      working-directory: web
      run: npm run lint

    - name: Test web (Vitest — contract vectors + unit)
      working-directory: web
      run: npm run test

    - name: Build web
      working-directory: web
      run: npm run build

    - name: Run tests with coverage gate
      env:
        PRECONSULT_API_KEY: ci_test_key_123
      run: |
        uv run pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=80

  e2e-spa:
    # Browser E2E for the React SPA (web/), which is served at / by the Python
    # host (`preconsult.host:app`). Builds the Vite app and drives it against a
    # real single-worker backend, with the SPA's /api calls mocked at the
    # browser layer (no live Vertex AI or serverless Redis).
    name: Playwright E2E (SPA)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps (with e2e extra)
        run: uv sync --locked --extra e2e

      - name: Install Playwright browser + system deps
        run: uv run python -m playwright install --with-deps chromium

      - name: Run SPA E2E
        run: scripts/run_e2e_spa.sh

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-spa-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Cloud Run
    needs: test
    # Only run deploy on push to main or manual dispatch
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      latest_ready_revision: ${{ steps.promote.outputs.latest_ready_revision }}
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Fail in seconds instead of after the ~4 minute container build. A secret
      # referenced by the deploy step but absent from Secret Manager otherwise
      # surfaces as a gcloud error at deploy time, which reads like a workflow
      # bug: on 2026-10-26 that was `SESSION_SECRET`, never created since the
      # cookie-auth work, and production silently stayed on a 2026-09-08 build.
      # Keep this list in sync with the `secrets:` block below;
      # tests/test_ci_workflow.py asserts the two sets match.
      - name: Verify required secrets exist
        run: |
          # Distinguish "no such version" from "not allowed to look": the deploy
          # service account has secretmanager.secretAccessor (which reads
          # payloads) but needed secretmanager.viewer to describe versions. On
          # 2026-10-26 the original check reported all three secrets as missing
          # when the real cause was a permission denial, which sent the
          # investigation in the wrong direction.
          failed=0
          for name in REDIS_URL SECUREMED_API_KEY SESSION_SECRET; do
            if err="$(gcloud secrets versions describe latest --secret="$name" --project="$PROJECT_ID" 2>&1 >/dev/null)"; then
              continue
            fi
            failed=1
            if echo "$err" | grep -qi "permission\|denied\|forbidden\|does not have"; then
              echo "::error::Cannot read Secret Manager metadata for '$name'. The deploy service account needs roles/secretmanager.viewer. gcloud said: $err"
            else
              echo "::error::Secret Manager has no enabled 'latest' version for '$name'. gcloud said: $err"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Refusing to build: fix the secret(s) above before deploying."
            exit 1
          fi
          echo "All referenced secrets resolve and are readable by the deploy identity."

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          # Scope the write cache to this run's SHA so the shared `main` scope
          # does not accumulate unbounded buildx blobs run over run (each push
          # used to append ~1GB of layer blobs to the default scope, driving the
          # Actions cache to >10GB). Reads still hit the prior stable cache.
          cache-to: type=gha,mode=max,scope=${{ github.sha }}

      - name: Set Deployment Flags for Profile
        id: profile
        run: |
          PROFILE="${{ env.DEPLOY_PROFILE }}"
          echo "🚀 Selected Deployment Profile: $PROFILE"
          # --no-use-http2 forces HTTP/1.1 to the container. The service port
          # was previously (sticky) named `h2c`, so Cloud Run's proxy spoke
          # HTTP/2 cleartext which uvicorn 0.34 has NO support for -> every
          # request reset with 502 "Invalid HTTP request received". HTTP/1.1
          # (the `http1` port name, used by the verified-working revisions) is
          # what uvicorn serves cleanly.
          # min-instances=1 + --session-affinity keep one warm instance on the
          # default profile. That is a deliberate, UNCHANGED choice for now, not a
          # correctness requirement: the only genuinely in-memory state is the
          # per-worker Redis-outage fallback (session + rate-limit shims), which is
          # a resilience shim rather than a store of truth. The flag choice is
          # pending a load measurement; do not loosen it before that lands.
          # --cpu=0.5 / --memory=1Gi is right-sized: a single async uvicorn worker
          # (not "2 workers", which is a stale note) doesn't saturate 1 vCPU, and 1Gi
          # still clears the in-memory PDF + 512-session shim headroom.
          # --concurrency=1 is REQUIRED to pair with --cpu=0.5: Cloud Run rejects
          # cpu < 1 when concurrency > 1 ("Total cpu < 1 is not supported with
          # concurrency > 1"). This is a portfolio app with effectively serial use,
          # so a single in-flight request per instance is acceptable.
          if [ "$PROFILE" = "high_performance" ]; then
            echo "flags=--allow-unauthenticated --session-affinity --no-use-http2 --max-instances=10 --min-instances=2 --concurrency=40 --cpu=2 --memory=2Gi --no-cpu-throttling" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--allow-unauthenticated --session-affinity --no-use-http2 --max-instances=5 --min-instances=1 --concurrency=1 --cpu=0.5 --memory=1Gi --cpu-throttling" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # `env_vars` and `secrets` are forwarded line by line and comments are
          # NOT stripped: a `#` line in `env_vars` becomes an empty-valued
          # variable named after the comment, and in `secrets` it becomes an
          # invalid secret reference. That is what failed the main deploy on
          # 2026-10-26: "No secret version specified for # Per-session cookie
          # signing key...:latest". Keep explanations OUTSIDE these blocks.
          # Both strategies are `overwrite` so this file is the single source of
          # truth for the service environment. That is not cosmetic: the failed
          # deploys of 2026-10-26 merged AWS secret refs and comment-named env
          # vars into the service template, and `merge` carries them into every
          # future revision - the AWS secrets do not exist, so each deploy would
          # keep failing on them even after they leave this file. Add the AWS_*
          # refs back here when Bedrock is switched on.
          # ALLOW_PUBLIC_INIT=true is set below because the SPA at / holds no
          # API key (cookie-only), so the session bootstrap has to be reachable
          # anonymously for it to start at all. Guards: the bot gate, 2/min plus
          # 20/day per client IP (bucketing verified in production 2026-10-26)
          # and the bounds on SessionInitRequest. Keep comments OUT of the
          # blocks below - they are forwarded to gcloud verbatim.
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          env_vars: |
            API_BASE_URL=https://pre-consult.org
            GOOGLE_CLOUD_PROJECT=securemed-chat-494521
            VERTEX_AI_REGION=us-central1
            LLM_PROVIDER=vertex
            LLM_MODEL=gemini-2.5-flash
            ALLOW_PUBLIC_INIT=true
            TRUST_PROXY_HEADERS=true
          # SESSION_SECRET: per-session cookie signing key (openssl rand -hex 32).
          secrets: |
            REDIS_URL=REDIS_URL:latest
            PRECONSULT_API_KEY=SECUREMED_API_KEY:latest
            SESSION_SECRET=SESSION_SECRET:latest
          flags: ${{ steps.profile.outputs.flags }}

      # The deploy action's `revision_traffic: LATEST=100` input has proven
      # unreliable here (the freshly built revision was repeatedly left
      # Ready-but-Retired with 0% traffic while 100% stayed pinned to an old
      # revision). Promote explicitly and verify, so the new build is actually
      # what serves production and the smoke test exercises the new revision.
      - name: Promote latest revision (to-latest)
        id: promote
        run: |
          # 1. Promote: route 100% of traffic to the newest ready revision.
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --to-latest > /dev/null

          # 2. Capture the latest ready revision name for the smoke test.
          LATEST_READY="$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.latestReadyRevisionName)')"
          echo "latest_ready_revision=${LATEST_READY}" >> "$GITHUB_OUTPUT"
          echo "Promoted traffic to latest ready revision: ${LATEST_READY}"

          # 3. Verify: the top traffic target must be the latest ready revision
          #    at 100%. Fail loudly otherwise so stale builds never get green-lit.
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, sys
          with open('/tmp/service.json') as f:
              svc = json.load(f)
          status = svc.get('status', {})
          latest_ready = status.get('latestReadyRevisionName')
          traffic = status.get('traffic') or []
          if not traffic:
              sys.exit(f"ERROR: no traffic targets on service {svc['metadata']['name']}")
          # Traffic is ordered by percentage; promoted revision should be at the top.
          top = traffic[0]
          if top.get('revisionName') != latest_ready:
              sys.exit(f"ERROR: traffic not promoted. Top target {top.get('revisionName')} "
                       f"!= latest ready revision {latest_ready}")
          if top.get('percent') != 100:
              sys.exit(f"ERROR: top target {top.get('revisionName')} has "
                       f"{top.get('percent')}% traffic, expected 100%")
          print(f"OK: {top['revisionName']} serving {top['percent']}% of traffic")
          PY

  smoke-test:
    name: Smoke Test Deployed Endpoint
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get Cloud Run URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # Guard: the revision actually serving traffic must be the one just
      # promoted by the deploy job. If traffic is still on a stale revision
      # (e.g. promotion regresses), fail here instead of green-lighting the old
      # build.
      - name: Verify served revision matches deployed revision
        env:
          EXPECTED_REVISION: ${{ needs.deploy.outputs.latest_ready_revision }}
        run: |
          echo "Expected (promoted) revision: ${EXPECTED_REVISION}"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, os, sys
          exp = os.environ.get("EXPECTED_REVISION", "")
          with open('/tmp/service.json') as f:
              svc = json.load(f)
          traffic = (svc.get('status', {}).get('traffic') or [])
          top = traffic[0] if traffic else {}
          serving = top.get('revisionName')
          percent = top.get('percent')
          print(f"Serving revision: {serving} ({percent}%)")
          if not exp:
              sys.exit("ERROR: no expected revision supplied from deploy job")
          if serving != exp:
              sys.exit(f"ERROR: serving revision {serving} != deployed revision {exp}; "
                       f"smoke test would validate a stale build")
          if (percent or 0) != 100:
              sys.exit(f"ERROR: serving revision {serving} at {percent}%, expected 100%")
          print("OK: traffic is on the newly deployed revision")
          PY

      - name: Run Multi-Stage Smoke Tests
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          EXPECTED_REVISION: ${{ needs.deploy.outputs.latest_ready_revision }}
        run: |
          # NOTE: the Redis-backed session init + AI question stream are NOT
          # exercised here against the deployed (serverless/Upstash) Redis. Each
          # push used to create + read a real session, burning the free-tier
          # Redis request quota for no coverage gain. The full session/stream/
          # rate-limit/SSE coverage runs in the `test` job against a local
          # redis:alpine service. This deployed smoke test focuses on whether
          # the served container is up and the document, asset graph and legal
          # pages of the SPA it serves are intact — the paths most prone to
          # silent breakage.

          # 1. Warm-up and Liveness check
          echo "==== Stage 1: Liveness / Health Check ===="
          HEALTH_URL="${BASE_URL}/health"
          SUCCESS=false
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" --connect-timeout 15 --max-time 30 || echo "000")
            echo "Health ping $i: HTTP Status $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            echo "Waiting 10 seconds for service to warm up..."
            sleep 10
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "::error::Liveness check failed! Service is unreachable."
            exit 1
          fi

          # 2. SPA document cache-control + head contract
          #
          # The document served at / MUST be uncacheable (no-store). It references
          # content-hashed chunks; if a stale document is cached (at the Google
          # Frontend edge or in a browser) while the build advances, the browser
          # resolves old chunk URLs that 404 on the new revision and the app JS
          # never loads. Assert the no-store contract on the origin so a future
          # deploy can't silently re-whitelist document caching.
          #
          # The head assertions are the crawler/share contract for the public
          # root document: a <title> naming PreConsult, an og:image for link
          # previews, and no `noindex` (which would de-index the site).
          echo "==== Stage 2: SPA document at / is uncacheable and crawlable ===="
          curl -s -D /tmp/idx_headers.txt -o /tmp/idx.html "${BASE_URL}/" \
            --connect-timeout 15 --max-time 30
          DOC_CTRL=$(tr -d '\r' < /tmp/idx_headers.txt | grep -i -m1 '^cache-control:' | sed -e 's/^[Cc]ache-[Cc]ontrol:[[:space:]]*//')
          echo "index.html cache-control: '${DOC_CTRL}'"
          if [ -z "$DOC_CTRL" ] || ! echo "$DOC_CTRL" | grep -qi "no-store"; then
            echo "::error::The document at / is cacheable (cache-control: '${DOC_CTRL}'). A stale shell can 404 its chunks and break the app."
            exit 1
          fi
          echo "index.html no-store contract OK"

          if ! grep -qi '<title>[^<]*PreConsult' /tmp/idx.html; then
            echo "::error::The document at / has no <title> mentioning PreConsult."
            exit 1
          fi
          if ! grep -qi 'og:image' /tmp/idx.html; then
            echo "::error::The document at / has no og:image meta tag."
            exit 1
          fi
          if grep -qi 'noindex' /tmp/idx.html; then
            echo "::error::The document at / is marked noindex; the public site must stay indexable."
            exit 1
          fi
          echo "Document head OK (<title> PreConsult, og:image, indexable)"

          # 3. Asset-graph integrity
          #
          # Every /assets/* reference in the served document must resolve to
          # 200. This is the direct guard against the stale-shell failure mode:
          # if the shell names chunks that don't exist (or a build left the
          # bundle internally inconsistent), the app JS never loads for users.
          echo "==== Stage 3: Served document asset graph is resolvable ===="
          DOC_HTML=$(curl -s "${BASE_URL}/" --connect-timeout 15 --max-time 30)
          FAILED=0
          for asset in $(echo "$DOC_HTML" | grep -oE '(src|href)="/[^"]+"' | sed -E 's/(src|href)="([^"]+)"/\2/' | grep -E '\.(js|css)$'); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}${asset}" --connect-timeout 15 --max-time 30 || echo "000")
            echo "  $CODE  $asset"
            if [ "$CODE" != "200" ]; then
              echo "::error::The served document references a missing asset: $asset (HTTP $CODE)"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::The asset graph is incomplete; the app JS would fail to load."
            exit 1
          fi
          echo "Asset graph OK: all document-referenced chunks resolve 200"

          # 4. Served-bundle revision guard
          #
          # Cross-check the serving instance reports the revision that was just
          # promoted. If user traffic is still landing on an old revision (or a
          # cached document references an earlier build), the served bundle and
          # the deployed revision diverge and the stale-shell failure returns.
          # /health/metrics exposes the worker's K_REVISION read-only and PHI-free.
          echo "==== Stage 4: Served instance matches deployed revision ===="
          SERVED_REV=$(curl -s "${BASE_URL}/health/metrics" --connect-timeout 15 --max-time 30 \
            | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p')
          echo "Served /health/metrics revision: '${SERVED_REV}'"
          echo "Expected deployed revision: '${EXPECTED_REVISION}'"
          # Cloud Run K_REVISION is the trailing segment after '/'; normalise.
          SERVED_REV_BASE="${SERVED_REV##*:}"
          if [ -z "$SERVED_REV" ] || [ "$SERVED_REV_BASE" != "$EXPECTED_REVISION" ] && [ "$SERVED_REV" != "$EXPECTED_REVISION" ]; then
            echo "::error::Served instance revision '${SERVED_REV}' does not match deployed revision '${EXPECTED_REVISION}'. A stale build is serving traffic."
            exit 1
          fi
          echo "Served revision matches deployed revision"

          # 5. Legal documents load from the packaged files
          #
          # /privacy and /terms are read from web/legal/*.html at runtime
          # (preconsult.site.legal). If those files are missing from the image -
          # excluded by .dockerignore, removed in a build stage, or resolved
          # against the wrong working directory - the request 500s instead of
          # serving the policy. That is a compliance surface, not cosmetics, so
          # assert every page and both languages against the deployed revision.
          echo "==== Stage 5: Legal documents served from packaged files ===="
          for page in privacy terms; do
            for lang in en pt; do
              BODY=$(curl -sS "${BASE_URL}/${page}?lang=${lang}" --connect-timeout 15 --max-time 30)
              echo "${BODY}" | grep -q "<html lang=\"${lang}\">" \
                || { echo "::error::/${page}?lang=${lang} did not return the ${lang} document"; exit 1; }
            done
            echo "/${page}: en + pt served"
          done

          echo "==== Smoke Test Passed Successfully! ===="
