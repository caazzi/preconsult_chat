[project]
name = "preconsult"
version = "0.1.0"
description = "PreConsult - Privacy-First Medical Intake Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.161.1",
    "gunicorn==26.2.0",
    # Only the LangChain *provider* package is used: the code imports
    # `langchain_core` (its dependency) and never the `langchain` meta-package,
    # which was pulling in sqlalchemy + langchain-text-splitters for nothing.
    "langchain-google-vertexai==2.1.2",
    "pydantic==2.14.1",
    "reportlab==5.1.0",
    # Plain uvicorn instead of `uvicorn[standard]`: the performance pieces
    # (uvloop, httptools) stay, while `watchfiles` (only for --reload) and
    # `websockets` (we serve no WebSocket) stay out of the image.
    "uvicorn==0.54.0",
    "uvloop==0.22.1",
    "httptools==0.8.0",
    "python-dotenv==1.2.4",
    "redis==6.4.0",
    "sentry-sdk==2.73.0",
    # Pinned because SPAStaticFiles subclasses Starlette's StaticFiles and
    # depends on its path-normalisation/cache semantics; a major bump must be
    # a deliberate change with the static tests re-read, not a silent re-lock.
    "starlette==1.3.1",
]

[project.optional-dependencies]
# Bedrock is opt-in (LLM_PROVIDER=bedrock) and this deployment has no AWS
# credentials, so boto3/botocore (~34 MB) stay out of the default image. A
# Bedrock deployment installs the extra:
#   uv sync --locked --extra bedrock
# CI installs --all-extras, so the Bedrock path keeps its tests.
bedrock = [
    "langchain-aws==0.2.35",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "httpx",
    "ruff",
]
# Browser E2E. Kept separate from `test` so the coverage-gated unit suite stays
# lean and the Playwright specs (which drive a real backend + browser, not the
# Python state machine) don't enter the 80% branch-coverage gate.
e2e = [
    "playwright",
    "pytest-playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Security floors for transitive dependencies that are not ours to declare in
# `[project.dependencies]` (they are pulled in by httpx/starlette/reportlab).
# Pinning them here makes the constraint explicit in the manifest Dependabot
# reads, and stops a plain `uv lock` from silently re-resolving back below the
# patched versions:
#   certifi  GHSA-6q48-6c7w-9gw2 (compromised emSign intermediate CAs)
#   anyio    GHSA-82r6-8w77-94w6 (TLSStream IDNA 2003 host encoding)
#   pillow   GHSA-5x8w-8jj5-q52h + 4 more (image-decode memory corruption)
# Pillow only arrives via reportlab (we never decode images), but the upgrade is
# free and keeps the alert list honest.
#   urllib3  GHSA-vxq7-64xx-v4gw (unbounded stream/read_chunked buffering)
#   langchain-core GHSA-pjwx-r37v-7724 (unsafe deserialization <= 0.3.84)
#
# Deliberately NOT floor-able here: the pyarrow use-after-free
# (GHSA-rgxp-2hwp-jwgg) is only patched in pyarrow 23.0.1, but
# langchain-google-vertexai 2.1.2 pins pyarrow>=19.0.1,<22. It disappears with
# the 3.x provider migration, which drops pyarrow from the tree entirely
# instead of bumping it (that migration must move langchain-aws in lockstep,
# since both providers share the universal lock).
constraint-dependencies = [
    "certifi>=2026.10.18",
    "anyio>=4.14.2",
    "pillow>=13.0.0",
    "urllib3>=2.8.0",
    "langchain-core>=0.3.85",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as async",
    "e2e: browser end-to-end tests (drive a real backend via Playwright)",
]
# `-m 'not e2e'` keeps browser specs out of the default suite (they need the
# `e2e` extra + Playwright + a booted backend). scripts/run_e2e_spa.sh overrides
# with an explicit `-m e2e`.
addopts = "--strict-markers -m 'not e2e'"
norecursedirs = [
    ".git",
    ".venv",
    ".direnv",
    "node_modules",
    "web",
    "tests/e2e_spa",
]

[tool.coverage.run]
source = ["src/preconsult"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["src/preconsult"]
