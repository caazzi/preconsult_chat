version: 2
updates:
  # --- Python dependencies ------------------------------------------------
  # Deployments go ONLY through GitHub Actions CI/CD, and every merged pip bump
  # triggers a full Cloud Run deploy.
  #
  # Strategy (long-term friendly): don't HIDE deps forever via `ignore`.
  #   - patch/minor: grouped into one weekly PR -> auto-mergeable, low risk.
  #   - major: still surfaced as its own PR (group "major"), clearly labelled,
  #     so breaking upgrades (reflex, langchain, aiplatform, ...) stay visible
  #     and can be batched/reviewed deliberately instead of silently forgotten.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: "increase-if-necessary"
    groups:
      patch-minor:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      major:
        applies-to: version-updates
        update-types: ["major"]

  # --- GitHub Actions -----------------------------------------------------
  # CI-only tooling; upgrading never affects the shipped container, so group
  # and auto-bump freely.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "ci"
    groups:
      actions:
        patterns: ["*"]

  # --- Docker base image --------------------------------------------------
  # Python is pinned by design (pyproject.toml requires >=3.11,<3.13). Keep the
  # base image on a monthly cadence and ignore the python major bumps so the
  # image stays in line with the supported interpreter range. This is the ONE
  # intentional ignore: the env constraint is a deliberate pin, not drift.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "python"
