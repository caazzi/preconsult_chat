version: 2
updates:
  # --- Python dependencies ------------------------------------------------
  # Deployments go ONLY through GitHub Actions CI/CD, and every merged pip bump
  # triggers a full Cloud Run deploy.
  #
  # Strategy (long-term friendly): don't HIDE deps forever via `ignore`.
  #   - patch/minor: grouped into one weekly PR -> low risk, easy to review.
  #     (No merge queue / auto-merge workflow is wired up yet, so each PR is
  #     approved and merged manually.)
  #   - major: deliberately NOT grouped. Each semver-major update therefore
  #     lands as its own PR so breaking upgrades (langchain, vertexai,
  #     aiplatform, redis, ...) are migrated and reviewed one at a time —
  #     every one of them is a separate deploy-affecting change. Do not merge
  #     multiple majors in a single bullet.
  #
  # Manifest: deps live in PEP 621 `pyproject.toml` (root); there is no
  # requirements.txt. Dependabot resolves the pip update from pyproject.toml —
  # the same manifest `uv sync --frozen` installs from in the Docker build.
  # Note: only `[project.dependencies]` (runtime) ship to the container;
  # the `test`/`e2e` extras are dev-only and don't trigger deploys.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: "increase-if-necessary"
    groups:
      patch-minor:
        applies-to: version-updates
        update-types: ["patch", "minor"]

  # --- GitHub Actions -----------------------------------------------------
  # CI-only tooling; upgrading never affects the shipped container, so group
  # and auto-bump freely.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "ci"
    groups:
      actions:
        patterns: ["*"]

  # --- Docker base image --------------------------------------------------
  # Python is pinned by design (pyproject.toml requires >=3.11,<3.13). Keep the
  # base image on a monthly cadence and ignore the python major bumps so the
  # image stays in line with the supported interpreter range. This is the ONE
  # intentional ignore: the env constraint is a deliberate pin, not drift.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "python"
