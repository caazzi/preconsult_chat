name: PreConsult CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy_profile:
        description: 'Deployment Profile (cost_optimized = 1 CPU/2GB/min=1/cpu-throttling [Option B], high_performance = 2 CPU/2GB/min=2/no-throttle)'
        required: true
        default: 'cost_optimized'
        type: choice
        options:
          - cost_optimized
          - high_performance

env:
  PROJECT_ID: securemed-chat-494521
  REGION: us-central1
  SERVICE_NAME: preconsult
  AR_REPO: securemed-repo
  WIF_PROVIDER: projects/811607528687/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-deploy-sa@securemed-chat-494521.iam.gserviceaccount.com
  DEPLOY_PROFILE: ${{ inputs.deploy_profile || 'cost_optimized' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.11"
        enable-cache: true
        
    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run linting
      run: |
        uv run ruff check . || echo "Ruff failed, but continuing for now."

    - name: Run tests with coverage gate
      env:
        PRECONSULT_API_KEY: ci_test_key_123
      run: |
        uv run pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=80

  deploy:
    name: Deploy to Cloud Run
    needs: test
    # Only run deploy on push to main or manual dispatch
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      latest_ready_revision: ${{ steps.promote.outputs.latest_ready_revision }}
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          build-args: |
            API_URL=https://pre-consult.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Deployment Flags for Profile
        id: profile
        run: |
          PROFILE="${{ env.DEPLOY_PROFILE }}"
          echo "🚀 Selected Deployment Profile: $PROFILE"
          # --no-use-http2 forces HTTP/1.1 to the container. The service port
          # was previously (sticky) named `h2c`, so Cloud Run's proxy spoke
          # HTTP/2 cleartext which uvicorn 0.34 has NO support for -> every
          # request reset with 502 "Invalid HTTP request received". HTTP/1.1
          # (the `http1` port name, used by the verified-working revisions) is
          # what uvicorn serves cleanly.
          if [ "$PROFILE" = "high_performance" ]; then
            echo "flags=--allow-unauthenticated --session-affinity --no-use-http2 --max-instances=10 --min-instances=2 --concurrency=40 --cpu=2 --memory=2Gi --no-cpu-throttling" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--allow-unauthenticated --session-affinity --no-use-http2 --max-instances=5 --min-instances=1 --concurrency=80 --cpu=1 --memory=2Gi --cpu-throttling" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            API_BASE_URL=https://pre-consult.org
            VERTEX_AI_REGION=us-central1
            GOOGLE_CLOUD_PROJECT=securemed-chat-494521
            LLM_MODEL=gemini-2.5-flash
          secrets: |
            REDIS_URL=REDIS_URL:latest
            PRECONSULT_API_KEY=SECUREMED_API_KEY:latest
          flags: ${{ steps.profile.outputs.flags }}

      # The deploy action's `revision_traffic: LATEST=100` input has proven
      # unreliable here (the freshly built revision was repeatedly left
      # Ready-but-Retired with 0% traffic while 100% stayed pinned to an old
      # revision). Promote explicitly and verify, so the new build is actually
      # what serves production and the smoke test exercises the new revision.
      - name: Promote latest revision (to-latest)
        id: promote
        run: |
          # 1. Promote: route 100% of traffic to the newest ready revision.
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --to-latest > /dev/null

          # 2. Capture the latest ready revision name for the smoke test.
          LATEST_READY="$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.latestReadyRevisionName)')"
          echo "latest_ready_revision=${LATEST_READY}" >> "$GITHUB_OUTPUT"
          echo "Promoted traffic to latest ready revision: ${LATEST_READY}"

          # 3. Verify: the top traffic target must be the latest ready revision
          #    at 100%. Fail loudly otherwise so stale builds never get green-lit.
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, sys
          with open('/tmp/service.json') as f:
              svc = json.load(f)
          status = svc.get('status', {})
          latest_ready = status.get('latestReadyRevisionName')
          traffic = status.get('traffic') or []
          if not traffic:
              sys.exit(f"ERROR: no traffic targets on service {svc['metadata']['name']}")
          # Traffic is ordered by percentage; promoted revision should be at the top.
          top = traffic[0]
          if top.get('revisionName') != latest_ready:
              sys.exit(f"ERROR: traffic not promoted. Top target {top.get('revisionName')} "
                       f"!= latest ready revision {latest_ready}")
          if top.get('percent') != 100:
              sys.exit(f"ERROR: top target {top.get('revisionName')} has "
                       f"{top.get('percent')}% traffic, expected 100%")
          print(f"OK: {top['revisionName']} serving {top['percent']}% of traffic")
          PY

  smoke-test:
    name: Smoke Test Deployed Endpoint
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get Cloud Run URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # Guard: the revision actually serving traffic must be the one just
      # promoted by the deploy job. If traffic is still on a stale revision
      # (e.g. promotion regresses), fail here instead of green-lighting the old
      # build.
      - name: Verify served revision matches deployed revision
        env:
          EXPECTED_REVISION: ${{ needs.deploy.outputs.latest_ready_revision }}
        run: |
          echo "Expected (promoted) revision: ${EXPECTED_REVISION}"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, os, sys
          exp = os.environ.get("EXPECTED_REVISION", "")
          with open('/tmp/service.json') as f:
              svc = json.load(f)
          traffic = (svc.get('status', {}).get('traffic') or [])
          top = traffic[0] if traffic else {}
          serving = top.get('revisionName')
          percent = top.get('percent')
          print(f"Serving revision: {serving} ({percent}%)")
          if not exp:
              sys.exit("ERROR: no expected revision supplied from deploy job")
          if serving != exp:
              sys.exit(f"ERROR: serving revision {serving} != deployed revision {exp}; "
                       f"smoke test would validate a stale build")
          if (percent or 0) != 100:
              sys.exit(f"ERROR: serving revision {serving} at {percent}%, expected 100%")
          print("OK: traffic is on the newly deployed revision")
          PY

      - name: Run Multi-Stage Smoke Tests
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
        run: |
          # 1. Warm-up and Liveness check
          echo "==== Stage 1: Liveness / Health Check ===="
          HEALTH_URL="${BASE_URL}/health"
          SUCCESS=false
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" --connect-timeout 15 --max-time 30 || echo "000")
            echo "Health ping $i: HTTP Status $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            echo "Waiting 10 seconds for service to warm up..."
            sleep 10
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "::error::Liveness check failed! Service is unreachable."
            exit 1
          fi

          # 1b. Redis connectivity assertion (health must report redis: ok)
          echo "==== Stage 1b: Redis Health Assertion ===="
          HEALTH_BODY=$(curl -s --connect-timeout 15 --max-time 45 "$HEALTH_URL")
          echo "Health body: $HEALTH_BODY"
          REDIS_STATE=$(echo "$HEALTH_BODY" | jq -r '.redis // "missing"')
          if [ "$REDIS_STATE" != "ok" ]; then
            echo "::error::Redis reported as '$REDIS_STATE'. Expected 'ok'. Health body: $HEALTH_BODY"
            exit 1
          fi

          # 2. Get API Key from GCP Secret Manager
          echo "==== Stage 2: Retrieve API Key ===="
          API_KEY=$(gcloud secrets versions access latest --secret="SECUREMED_API_KEY")
          if [ -z "$API_KEY" ]; then
            echo "::error::Failed to retrieve SECUREMED_API_KEY from Secret Manager"
            exit 1
          fi
          echo "API Key retrieved successfully."

          # 3. Session Initialization Test
          echo "==== Stage 3: Session Initialization ===="
          INIT_PAYLOAD='{
            "age_bracket": "26-35",
            "sex": "Female",
            "lang": "en",
            "specialist": "Cardiology",
            "chief_complaint": "Chest pain for smoke test",
            "duration": "Days",
            "complaint_detail": "Mild pain",
            "conditions": [],
            "medications": [],
            "allergies": "",
            "family_history": [],
            "smoking": "Never",
            "alcohol": "Rarely"
          }'

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${BASE_URL}/api/session/init" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: ${API_KEY}" \
            -d "$INIT_PAYLOAD" \
            --connect-timeout 15 --max-time 45 || echo -e "\nHTTP_STATUS:000")

          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Init Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Session initialization failed!"
            echo "Response Body: $RESPONSE_BODY"
            exit 1
          fi

          SESSION_ID=$(echo "$RESPONSE_BODY" | jq -r '.session_id')
          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "::error::Failed to parse session_id from response!"
            echo "Response Body: $RESPONSE_BODY"
            exit 1
          fi
          echo "Session initialized successfully with ID: $SESSION_ID"

          # 4. Stream Validation Test
          echo "==== Stage 4: AI Question Stream Validation ===="
          STREAM_PAYLOAD=$(printf '{"session_id": "%s"}' "$SESSION_ID")
          
          STREAM_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${BASE_URL}/api/interview-questions-stream" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: ${API_KEY}" \
            -d "$STREAM_PAYLOAD" \
            --connect-timeout 15 --max-time 60 || echo -e "\nHTTP_STATUS:000")

          STREAM_BODY=$(echo "$STREAM_RESPONSE" | sed '$d')
          STREAM_STATUS=$(echo "$STREAM_RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Stream HTTP Status: $STREAM_STATUS"
          if [ "$STREAM_STATUS" != "200" ]; then
            echo "::error::Stream endpoint failed!"
            echo "Response Body: $STREAM_BODY"
            exit 1
          fi

          if [[ "$STREAM_BODY" != *"data:"* ]]; then
            echo "::error::Stream body is invalid! Missing 'data:' event format."
            echo "Response Body: $STREAM_BODY"
            exit 1
          fi

          echo "First 150 characters of stream payload:"
          echo "${STREAM_BODY}" | head -c 150
          echo ""
          echo "==== Smoke Test Passed Successfully! ===="
