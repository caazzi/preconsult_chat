name: PreConsult CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy_profile:
        description: 'Deployment Profile (cost_optimized = 1 CPU/2GB/min=1/cpu-throttling [keeps one warm instance so the in-memory Engine.IO socket session survives, default], high_performance = 2 CPU/2GB/min=2/no-throttle)'
        required: true
        default: 'cost_optimized'
        type: choice
        options:
          - cost_optimized
          - high_performance

env:
  PROJECT_ID: securemed-chat-494521
  REGION: us-central1
  SERVICE_NAME: preconsult
  AR_REPO: securemed-repo
  WIF_PROVIDER: projects/811607528687/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-deploy-sa@securemed-chat-494521.iam.gserviceaccount.com
  DEPLOY_PROFILE: ${{ inputs.deploy_profile || 'cost_optimized' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.11"
        enable-cache: true
        
    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run linting
      run: |
        uv run ruff check . || echo "Ruff failed, but continuing for now."

    - name: Run tests with coverage gate
      env:
        PRECONSULT_API_KEY: ci_test_key_123
      run: |
        uv run pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=80

  e2e:
    # Browser E2E — hermetic: real single-worker backend + Playwright against a
    # frontend built for localhost. Covers the socket-session stability (the
    # multi-worker `400 "Invalid session"` bug) and the landing→Step-1 wizard
    # transition, which are purely client-side state over the Socket.IO channel,
    # so no live Vertex AI or serverless Redis is needed. Runs on every push/PR
    # so the fix can't silently regress.
    name: Playwright E2E (socket-session + wizard)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install deps (with e2e extra)
        run: uv sync --extra e2e

      - name: Install Playwright browser + system deps
        run: uv run python -m playwright install --with-deps chromium

      - name: Run E2E (single worker — the fixed configuration)
        run: scripts/run_e2e.sh

      # Flaky socket assertions are retried by Playwright/pytest; a genuine
      # regression (e.g. >1 gunicorn workers) surfaces as a hard failure here.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Cloud Run
    needs: test
    # Only run deploy on push to main or manual dispatch
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      latest_ready_revision: ${{ steps.promote.outputs.latest_ready_revision }}
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          build-args: |
            API_URL=https://pre-consult.org
            REFLEX_TRANSPORT=polling
          cache-from: type=gha
          # Scope the write cache to this run's SHA so the shared `main` scope
          # does not accumulate unbounded buildx blobs run over run (each push
          # used to append ~1GB of layer blobs to the default scope, driving the
          # Actions cache to >10GB). Reads still hit the prior stable cache.
          cache-to: type=gha,mode=max,scope=${{ github.sha }}

      - name: Set Deployment Flags for Profile
        id: profile
        run: |
          PROFILE="${{ env.DEPLOY_PROFILE }}"
          echo "🚀 Selected Deployment Profile: $PROFILE"
          # --no-use-http2 forces HTTP/1.1 to the container. The service port
          # was previously (sticky) named `h2c`, so Cloud Run's proxy spoke
          # HTTP/2 cleartext which uvicorn 0.34 has NO support for -> every
          # request reset with 502 "Invalid HTTP request received". HTTP/1.1
          # (the `http1` port name, used by the verified-working revisions) is
          # what uvicorn serves cleanly.
          # min-instances=1 on the default (cost_optimized) profile is a CORRECTNESS
          # requirement, not a latency nice-to-have. The app runs a SINGLE gunicorn
          # worker with no Redis token manager, so the whole Engine.IO session store
          # lives in one worker's memory. With scale-to-zero (min=0) the instance is
          # recycled at idle, so the browser's already-connected socket POSTs its
          # next state event ("Start Preparing") to a fresh instance with no session,
          # the server must 400 it, and reflex's client silently drops it — the
          # wizard never advances. Holding one warm instance keeps the socket alive,
          # and --session-affinity keeps the browser on it. Cost bounded to one idle
          # 1 vCPU / 2Gi instance.
          if [ "$PROFILE" = "high_performance" ]; then
            echo "flags=--allow-unauthenticated --session-affinity --no-use-http2 --max-instances=10 --min-instances=2 --concurrency=40 --cpu=2 --memory=2Gi --no-cpu-throttling" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--allow-unauthenticated --session-affinity --no-use-http2 --max-instances=5 --min-instances=1 --concurrency=80 --cpu=1 --memory=2Gi --cpu-throttling" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            API_BASE_URL=https://pre-consult.org
            VERTEX_AI_REGION=us-central1
            GOOGLE_CLOUD_PROJECT=securemed-chat-494521
            LLM_MODEL=gemini-2.5-flash
            # Reflex/engine.io socket idle timeout (seconds). Raised from the
            # 120s default so an idle user's session is less likely to be closed
            # server-side while the page is open; a late click then re-handshakes
            # cleanly instead of hitting a stale-session failure. (The 400
            # translation in _RequestIDMiddleware is the real fix; this lowers the
            # frequency of the racy case.)
            REFLEX_SOCKET_TIMEOUT=600
          secrets: |
            REDIS_URL=REDIS_URL:latest
            PRECONSULT_API_KEY=SECUREMED_API_KEY:latest
          flags: ${{ steps.profile.outputs.flags }}

      # The deploy action's `revision_traffic: LATEST=100` input has proven
      # unreliable here (the freshly built revision was repeatedly left
      # Ready-but-Retired with 0% traffic while 100% stayed pinned to an old
      # revision). Promote explicitly and verify, so the new build is actually
      # what serves production and the smoke test exercises the new revision.
      - name: Promote latest revision (to-latest)
        id: promote
        run: |
          # 1. Promote: route 100% of traffic to the newest ready revision.
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --to-latest > /dev/null

          # 2. Capture the latest ready revision name for the smoke test.
          LATEST_READY="$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.latestReadyRevisionName)')"
          echo "latest_ready_revision=${LATEST_READY}" >> "$GITHUB_OUTPUT"
          echo "Promoted traffic to latest ready revision: ${LATEST_READY}"

          # 3. Verify: the top traffic target must be the latest ready revision
          #    at 100%. Fail loudly otherwise so stale builds never get green-lit.
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, sys
          with open('/tmp/service.json') as f:
              svc = json.load(f)
          status = svc.get('status', {})
          latest_ready = status.get('latestReadyRevisionName')
          traffic = status.get('traffic') or []
          if not traffic:
              sys.exit(f"ERROR: no traffic targets on service {svc['metadata']['name']}")
          # Traffic is ordered by percentage; promoted revision should be at the top.
          top = traffic[0]
          if top.get('revisionName') != latest_ready:
              sys.exit(f"ERROR: traffic not promoted. Top target {top.get('revisionName')} "
                       f"!= latest ready revision {latest_ready}")
          if top.get('percent') != 100:
              sys.exit(f"ERROR: top target {top.get('revisionName')} has "
                       f"{top.get('percent')}% traffic, expected 100%")
          print(f"OK: {top['revisionName']} serving {top['percent']}% of traffic")
          PY

  smoke-test:
    name: Smoke Test Deployed Endpoint
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get Cloud Run URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # Guard: the revision actually serving traffic must be the one just
      # promoted by the deploy job. If traffic is still on a stale revision
      # (e.g. promotion regresses), fail here instead of green-lighting the old
      # build.
      - name: Verify served revision matches deployed revision
        env:
          EXPECTED_REVISION: ${{ needs.deploy.outputs.latest_ready_revision }}
        run: |
          echo "Expected (promoted) revision: ${EXPECTED_REVISION}"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, os, sys
          exp = os.environ.get("EXPECTED_REVISION", "")
          with open('/tmp/service.json') as f:
              svc = json.load(f)
          traffic = (svc.get('status', {}).get('traffic') or [])
          top = traffic[0] if traffic else {}
          serving = top.get('revisionName')
          percent = top.get('percent')
          print(f"Serving revision: {serving} ({percent}%)")
          if not exp:
              sys.exit("ERROR: no expected revision supplied from deploy job")
          if serving != exp:
              sys.exit(f"ERROR: serving revision {serving} != deployed revision {exp}; "
                       f"smoke test would validate a stale build")
          if (percent or 0) != 100:
              sys.exit(f"ERROR: serving revision {serving} at {percent}%, expected 100%")
          print("OK: traffic is on the newly deployed revision")
          PY

      - name: Run Multi-Stage Smoke Tests
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          REFLEX_TRANSPORT: polling
          EXPECTED_REVISION: ${{ needs.deploy.outputs.latest_ready_revision }}
        run: |
          # 1. Warm-up and Liveness check
          echo "==== Stage 1: Liveness / Health Check ===="
          HEALTH_URL="${BASE_URL}/health"
          SUCCESS=false
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" --connect-timeout 15 --max-time 30 || echo "000")
            echo "Health ping $i: HTTP Status $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            echo "Waiting 10 seconds for service to warm up..."
            sleep 10
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "::error::Liveness check failed! Service is unreachable."
            exit 1
          fi

          # 1c. Reflex event-channel assertion.
          # Reflex drives all state mutations (e.g. the "Start Preparing" button)
          # over the event channel. Historically only /health and the REST/SSE
          # endpoints were exercised, so the WebSocket-vs-HTTP2 failure on Cloud
          # Run shipped green. Probe the subscribed transport directly:
          #   - polling: the engine.io handshake must return 200 (HTTP long-poll
          #     over HTTP/2 works on Cloud Run).
          #   - websocket: an HTTP/1.1 Upgrade must complete with 101.
          # Any other result means interactive events are broken even though
          # liveness/REST pass, so fail the deploy loudly.
          echo "==== Stage 1c: Reflex Event-Channel Assertion ===="
          TRANSPORT="${REFLEX_TRANSPORT:-polling}"
          EVENT_CHANNEL="${BASE_URL}/_event/socket.io/?EIO=4&transport=${TRANSPORT}"
          EVENT_STATUS=$(curl -s -o /tmp/event_handshake.txt -w "%{http_code}" \
            "$EVENT_CHANNEL" --connect-timeout 15 --max-time 30 || echo "000")
          echo "Event channel (${TRANSPORT}) handshake HTTP Status: $EVENT_STATUS"
          echo "Response body: $(head -c 200 /tmp/event_handshake.txt)"
          if [ "$TRANSPORT" = "polling" ]; then
            if [ "$EVENT_STATUS" != "200" ]; then
              echo "::error::Reflex polling handshake failed with $EVENT_STATUS (expected 200). Interactive events are unavailable."
              echo "Body: $(cat /tmp/event_handshake.txt)"
              exit 1
            fi
          else
            # websocket: curl cannot fully detect 101 with -w; the responses
            # "400 Invalid websocket upgrade" (HTTP/2) vs "101" (HTTP/1.1) are
            # indistinguishable via exit code, so treat any non-200 body that
            # signals rejection as failure by checking the response code.
            if [ "$EVENT_STATUS" != "101" ] && ! grep -q "101 Switching Protocols" /tmp/event_handshake.txt 2>/dev/null; then
              echo "::error::Reflex websocket upgrade failed with HTTP status $EVENT_STATUS (expected 101). Interactive events are unavailable."
              echo "Body: $(cat /tmp/event_handshake.txt)"
              exit 1
            fi
          fi
          echo "Event channel (${TRANSPORT}) OK"

          # Protocol-version guard: the deployed server must speak Engine.IO v4
          # (EIO=4). A v3 client probe must be rejected with 400 "unsupported
          # version" — if the server instead accepts EIO=3, the runtime and the
          # built client bundle are skewed (e.g. a locally re-synced reflex that
          # disagreed with the CI-`--frozen` build) and interactive state will
          # 400 in real browsers. Pin the v4 contract so the regression can't
          # deploy green.
          EIO3_STATUS=$(curl -s -o /tmp/event_eio3.txt -w "%{http_code}" \
            "${BASE_URL}/_event/socket.io/?EIO=3&transport=polling" \
            --connect-timeout 15 --max-time 30 || echo "000")
          echo "Engine.IO v3 client probe HTTP Status: $EIO3_STATUS"
          if [ "$EIO3_STATUS" != "400" ] || ! grep -q "unsupported version" /tmp/event_eio3.txt; then
            echo "::error::Server did not reject Engine.IO v3 client with the expected 400 'unsupported version'. Protocol skew detected."
            echo "Body: $(cat /tmp/event_eio3.txt)"
            exit 1
          fi
          echo "Engine.IO protocol v4 contract OK (v3 client correctly rejected)"

          # NOTE: the Redis-backed session init + AI question stream are NOT
          # exercised here against the deployed (serverless/Upstash) Redis. Each
          # push used to create + read a real session, burning the free-tier
          # Redis request quota for no coverage gain. The full session/stream/
          # rate-limit/SSE coverage runs in the `test` job against a local
          # redis:alpine service. This deployed smoke test focuses on whether
          # the served container is up and the interactive (socket) channel
          # works — the paths most prone to silent breakage.

          # 5. Reflex State-Socket Connectivity Test
          #
          # This is the connection that the browser uses for all interactive
          # state changes ("Start Preparing" and every later step). The built
          # frontend polls the BARE /_event endpoint (no trailing slash) with
          # transport=polling; a valid setup answers with an Engine.IO handshake
          # JSON body (starts with `0{"sid"`), never HTML. A regression here
          # (e.g. an SPA fallback swallowing /_event) surfaces as a green deploy
          # while the UI is broken, so it MUST be asserted explicitly.
          echo "==== Stage 5: Reflex State-Socket (/_event) Connectivity ===="
          EVENT_RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" \
            "${BASE_URL}/_event?EIO=4&transport=polling" \
            --connect-timeout 15 --max-time 45 || echo -e "\nHTTP_STATUS:000")

          EVENT_BODY=$(echo "$EVENT_RESPONSE" | sed '$d')
          EVENT_STATUS=$(echo "$EVENT_RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Event HTTP Status: $EVENT_STATUS"
          if [ "$EVENT_STATUS" != "200" ]; then
            echo "::error::Reflex state-socket endpoint (/ _event) failed!"
            echo "Response Body: $EVENT_BODY"
            exit 1
          fi

          if [[ "$EVENT_BODY" != 0* || "$EVENT_BODY" != *'"sid"'* ]]; then
            echo "::error::/_event did not return an Engine.IO handshake. "
            echo "Response Body: ${EVENT_BODY}"
            exit 1
          fi
          echo "State-socket handshake OK: ${EVENT_BODY}" | head -c 120
          echo ""

          # 6. Index.html cache-control guard
          #
          # The served HTML shell MUST be uncacheable (no-store). It references
          # content-hashed chunks; if a stale shell is cached (at the Google
          # Frontend edge or browser) while the build advances, the browser
          # resolves old chunk URLs that 404 on the new revision, fails to load
          # the app JS and falls back to an old socket client — surfacing as the
          # production "unsupported version of the Socket.IO or Engine.IO
          # protocols" error on /_event. Assert the no-store contract on the
          # origin so a future deploy can't silently re-whitelist document
          # caching.
          echo "==== Stage 6: index.html must be uncacheable ===="
          curl -s -D /tmp/idx_headers.txt -o /dev/null "${BASE_URL}/" \
            --connect-timeout 15 --max-time 30
          DOC_CTRL=$(tr -d '\r' < /tmp/idx_headers.txt | grep -i -m1 '^cache-control:' | sed -e 's/^[Cc]ache-[Cc]ontrol:[[:space:]]*//')
          echo "index.html cache-control: '${DOC_CTRL}'"
          if [ -z "$DOC_CTRL" ] || ! echo "$DOC_CTRL" | grep -qi "no-store"; then
            echo "::error::index.html is cacheable (cache-control: '${DOC_CTRL}'). A stale shell can 404 its chunks and break the socket."
            exit 1
          fi
          echo "index.html no-store contract OK"

          # 7. Asset-graph integrity
          #
          # Every /assets/* reference in the served index.html must resolve to
          # 200. This is the direct guard against the stale-shell failure mode:
          # if the shell names chunks that don't exist (or a build left the
          # bundle internally inconsistent), the app JS never loads for users.
          echo "==== Stage 7: Served index.html asset graph is resolvable ===="
          DOC_HTML=$(curl -s "${BASE_URL}/" --connect-timeout 15 --max-time 30)
          FAILED=0
          for asset in $(echo "$DOC_HTML" | grep -oE '(src|href)="/[^"]+"' | sed -E 's/(src|href)="([^"]+)"/\2/' | grep -E '\.(js|css)$'); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}${asset}" --connect-timeout 15 --max-time 30 || echo "000")
            echo "  $CODE  $asset"
            if [ "$CODE" != "200" ]; then
              echo "::error::index.html references missing asset: $asset (HTTP $CODE)"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::index.html asset graph is incomplete; a cached/stale shell would break the socket."
            exit 1
          fi
          echo "Asset graph OK: all index.html-referenced chunks resolve 200"

          # 8. Served-bundle revision guard
          #
          # Cross-check the serving instance reports the revision that was just
          # promoted. If user traffic is still landing on an old revision (or a
          # cached document references an earlier build), the served bundle and
          # the deployed revision diverge and the stale-shell failure returns.
          # /health/metrics exposes the worker's K_REVISION read-only and PHI-free.
          echo "==== Stage 8: Served instance matches deployed revision ===="
          SERVED_REV=$(curl -s "${BASE_URL}/health/metrics" --connect-timeout 15 --max-time 30 \
            | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p')
          echo "Served /health/metrics revision: '${SERVED_REV}'"
          echo "Expected deployed revision: '${EXPECTED_REVISION}'"
          # Cloud Run K_REVISION is the trailing segment after '/'; normalise.
          SERVED_REV_BASE="${SERVED_REV##*:}"
          if [ -z "$SERVED_REV" ] || [ "$SERVED_REV_BASE" != "$EXPECTED_REVISION" ] && [ "$SERVED_REV" != "$EXPECTED_REVISION" ]; then
            echo "::error::Served instance revision '${SERVED_REV}' does not match deployed revision '${EXPECTED_REVISION}'. A stale build is serving traffic."
            exit 1
          fi
          echo "Served revision matches deployed revision"

          echo "==== Smoke Test Passed Successfully! ===="
