[project]
name = "preconsult"
version = "0.1.0"
description = "PreConsult - Privacy-First Medical Intake Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "gunicorn==26.2.0",
    "langchain-aws==0.2.35",
    "langchain-google-vertexai==2.1.2",
    "langchain==0.3.27",
    "google-cloud-aiplatform==1.165.0",
    "pydantic==2.14.1",
    "reportlab==5.1.0",
    "uvicorn[standard]==0.54.0",
    "python-dotenv==1.2.4",
    "redis==6.4.0",
    "sentry-sdk==2.73.0",
    # Pinned because SPAStaticFiles subclasses Starlette's StaticFiles and
    # depends on its path-normalisation/cache semantics; a major bump must be
    # a deliberate change with the static tests re-read, not a silent re-lock.
    "starlette==1.9.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "httpx",
    "ruff",
]
# Browser E2E. Kept separate from `test` so the coverage-gated unit suite stays
# lean and the Playwright specs (which drive a real backend + browser, not the
# Python state machine) don't enter the 80% branch-coverage gate.
e2e = [
    "playwright",
    "pytest-playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Security floors for transitive dependencies that are not ours to declare in
# `[project.dependencies]` (they are pulled in by httpx/starlette/reportlab).
# Pinning them here makes the constraint explicit in the manifest Dependabot
# reads, and stops a plain `uv lock` from silently re-resolving back below the
# patched versions:
#   certifi  GHSA-6q48-6c7w-9gw2 (compromised emSign intermediate CAs)
#   anyio    GHSA-82r6-8w77-94w6 (TLSStream IDNA 2003 host encoding)
#   pillow   GHSA-5x8w-8jj5-q52h + 4 more (image-decode memory corruption)
# Pillow only arrives via reportlab (we never decode images), but the upgrade is
# free and keeps the alert list honest.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "anyio>=4.14.2",
    "pillow>=13.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as async",
    "e2e: browser end-to-end tests (drive a real backend via Playwright)",
]
# `-m 'not e2e'` keeps browser specs out of the default suite (they need the
# `e2e` extra + Playwright + a booted backend). scripts/run_e2e_spa.sh overrides
# with an explicit `-m e2e`.
addopts = "--strict-markers -m 'not e2e'"
norecursedirs = [
    ".git",
    ".venv",
    ".direnv",
    "node_modules",
    "web",
    "tests/e2e_spa",
]

[tool.coverage.run]
source = ["src/preconsult"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["src/preconsult"]
